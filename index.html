<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hidden Forest - Project 1</title>
    
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;
        attribute vec3 vColor;
        attribute vec3 vNormal;
        attribute float vEmissive;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        varying vec3 fColor;
        varying vec3 fNormal;
        varying vec3 fPosition;
        varying vec3 fLightDir;
        varying float fEmissive;

        void main() {
            vec4 pos = modelViewMatrix * vPosition;
            fPosition = pos.xyz;
            fNormal = normalize(mat3(modelViewMatrix) * vNormal);

            // Fixed world-space direction — NOT rotated with camera
            fLightDir = normalize(vec3(0.4, 1.0, 0.3));

            fColor = vColor;
            fEmissive = vEmissive;
            gl_Position = projectionMatrix * pos;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 fColor;
        varying vec3 fNormal;
        varying vec3 fPosition;
        varying vec3 fLightDir;
        varying float fEmissive;

        uniform float fogDensity;

        void main() {
            vec3 N = normalize(fNormal);
            vec3 V = normalize(-fPosition);
            vec3 L = fLightDir;
            vec3 R = reflect(-L, N);
            float alpha = 1.0;

            float ndl = max(dot(N, L), 0.0);

            // Bright ambient so nothing goes fully dark
            float ambient = 0.35 + 0.10 * clamp(N.y, 0.0, 1.0);

            // Strong diffuse with warm sun tint
            vec3 sunColor = vec3(1.10, 0.95, 0.75);
            float diffuse = ndl * 1.1;

            vec3 color = fColor * ambient + fColor * sunColor * diffuse;

            // Warm specular highlight
            float spec = pow(max(dot(V, R), 0.0), 24.0) * 0.18 * step(0.0, ndl);
            color += vec3(1.0, 0.95, 0.8) * spec;

            // Emissive (sun/halo)
            if (fEmissive > 0.01) {
                float ndv = max(dot(N, V), 0.0);
                float rim = pow(1.0 - ndv, 2.6);

                if (fEmissive > 0.7) {
                    color = fColor * 1.35 + vec3(0.30,0.20,0.06) * (0.35 + rim * 0.3);
                    alpha = 1.0;
                } else {
                    color = fColor * (1.1 + 2.4 * rim) + vec3(0.55,0.30,0.10) * (0.55 + 1.8 * rim);
                    alpha = clamp(0.18 + 0.62 * rim, 0.18, 0.85);
                }
            }

            // Fog — much less aggressive, only kicks in at distance
            float dist = length(fPosition);
            float fog = exp(-fogDensity * dist * 0.4);  // 0.4 = pull fog way back
            vec3 sky = vec3(0.55, 0.75, 0.95);
            float fogFactor = mix(fog, 1.0, clamp(fEmissive * 0.85, 0.0, 1.0));
            // Don't force a minimum fog — let nearby colors stay pure
            color = mix(sky, color, clamp(fogFactor, 0.0, 1.0));

            gl_FragColor = vec4(color, alpha);
        }
    </script>

    <script type="text/javascript" src="webgl-utils.js"></script>
    <script type="text/javascript" src="initShaders.js"></script>
    <script type="text/javascript" src="common.js"></script>
    <script type="text/javascript" src="forest.js"></script>
</head>
<body style="background-color: #1a2a2a; margin: 0; display: flex; flex-direction: column; align-items: center;">
    <canvas id="gl-canvas" width="800" height="600" style="border: 1px solid #334444; margin-top: 20px;">
        WebGL Error
    </canvas>
    
    <div style="color: white; font-family: sans-serif; text-align: center; margin-top: 10px;">
        <h3>Hidden Forest - Project 1</h3>
        <p><b>WASD:</b> Move around the terrain</p>
        <p><b>Arrow Keys:</b> Look around (Pitch & Yaw)</p>
        <p><i>Mode: Smooth Shading</i></p>
    </div>
</body>
</html>
