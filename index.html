<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hidden Forest - Project 1</title>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;
        attribute vec3 vColor;
        attribute vec3 vNormal;
        attribute float vEmissive;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        varying vec3 fColor;
        varying vec3 fViewNormal;
        varying vec3 fWorldNormal;
        varying vec3 fPosition;
        varying vec3 fWorldPos; // Pass world position for noise
        varying float fEmissive;
        varying float fHeight;

        void main() {
            vec4 pos = modelViewMatrix * vPosition;
            fPosition = pos.xyz;
            fWorldPos = vPosition.xyz; 
            fHeight = vPosition.y; 
            fViewNormal = normalize(mat3(modelViewMatrix) * vNormal);
            fWorldNormal = normalize(vNormal);
            fColor = vColor;
            fEmissive = vEmissive;
            gl_Position = projectionMatrix * pos;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 fColor;
        varying vec3 fViewNormal;
        varying vec3 fWorldNormal;
        varying vec3 fPosition;
        varying vec3 fWorldPos;
        varying float fEmissive;
        varying float fHeight;

        uniform float fogDensity;

        // Hash noise for dappled sunlight patches
        float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
        }
        float smoothNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        void main() {
            // Sun low from the side — rakes across tree trunks and cone faces dramatically
            vec3 L = normalize(vec3(0.2, 1.0, -1.8));
            vec3 Nworld  = normalize(fWorldNormal);
            vec3 Nview   = normalize(fViewNormal);
            float NdL    = dot(Nworld, L);

            // === DAPPLED SUNLIGHT PATCHES ON GROUND ===
            float dapple = smoothNoise(fWorldPos.xz * 0.8) * 0.6
                         + smoothNoise(fWorldPos.xz * 2.1) * 0.4;
            dapple = smoothstep(0.38, 0.72, dapple);

            float litNdL = NdL + dapple * 0.35 * step(0.0, NdL);

            // === CEL BANDS — wider contrast between light and shadow ===
            float diffuse;
            vec3  sunTint;
            if (litNdL > 0.6) {
                diffuse = 1.0;
                sunTint = vec3(1.28, 1.15, 0.82); // warm golden sun
            } else if (litNdL > 0.05) {
                diffuse = 0.62;
                sunTint = vec3(0.95, 0.98, 0.88);
            } else {
                diffuse = 0.32;                    // shadows are actually dark now
                sunTint = vec3(0.55, 0.72, 1.0);  // cool blue-purple shadow
            }

            // Ambient — lower so shadows read clearly
            vec3 ambient = fColor * vec3(0.38, 0.52, 0.62) * 0.4;

            vec3 color = fColor * sunTint * diffuse;

            float shadowMask = 1.0 - smoothstep(-0.05, 0.25, NdL);
            color = mix(color, color + ambient, shadowMask * 0.5);

            // === SPECULAR ===
            vec3 V = normalize(-fPosition);
            vec3 R = reflect(-L, Nview);
            float specRaw = pow(max(dot(V, R), 0.0), 24.0) * step(0.0, NdL);
            float spec    = step(0.55, specRaw) * 0.35;
            color += vec3(1.0, 0.97, 0.75) * spec;

            // === EMISSIVE ===
            if (fEmissive > 0.01) {
                color = fColor * 2.2;
            }

            // === VOLUMETRIC MIST — exponential-squared for sharp near/far separation ===
            float dist      = length(fPosition);
            // exp2 fog falls off much faster = close trees vivid, far trees swallowed by mist
            float fogFactor = exp(-0.055 * dist * dist * 0.08 - 0.04 * dist);
            fogFactor       = clamp(fogFactor, 0.0, 1.0);
            // Cool blue-grey mist — contrasts with warm sunlit greens
            vec3 mistColor  = vec3(0.62, 0.74, 0.82);
            color = mix(mistColor, color, fogFactor);

            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script type="text/javascript" src="webgl-utils.js"></script>
    <script type="text/javascript" src="initShaders.js"></script>
    <script type="text/javascript" src="common.js"></script>
    <script type="text/javascript" src="forest.js"></script>
</head>
<body style="background-color: #1a2a2a; margin: 0; display: flex; flex-direction: column; align-items: center;">
    <canvas id="gl-canvas" width="800" height="600" style="border: 1px solid #334444; margin-top: 20px;">
        WebGL Error
    </canvas>

    <div style="color: white; font-family: sans-serif; text-align: center; margin-top: 10px;">
        <h3>Hidden Forest - Project 1</h3>
        <p><b>WASD:</b> Move around the terrain</p>
        <p><b>Arrow Keys:</b> Look around (Pitch & Yaw)</p>
        <p><i>Mode: Cel Shading</i></p>
    </div>
</body>
</html>
