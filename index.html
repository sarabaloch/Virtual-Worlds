<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hidden Forest - Project 1</title>
    
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 vPosition;
        attribute vec3 vColor;
        attribute vec3 vNormal;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        varying vec3 fColor;
        varying vec3 fNormal;

        void main(){

            fColor = vColor;
            fNormal = vNormal;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 fColor;
        varying vec3 fNormal;

        uniform vec3 lightDir;

        void main() {

            vec3 N = normalize(fNormal);
            vec3 L = normalize(lightDir);

            float diff = max(dot(N, L), 0.0);

            float ambient = 0.4;
            float lighting = ambient + 0.6 * diff;

            vec3 col = fColor * lighting;

            // 🌫️ SIMPLE FOG (CRITICAL)
            float depth = gl_FragCoord.z / gl_FragCoord.w;
            float fog = exp(-depth * 0.12);

            vec3 fogColor = vec3(0.55, 0.75, 0.95);

            col = mix(fogColor, col, fog);

            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script type="text/javascript" src="webgl-utils.js"></script>
    <script type="text/javascript" src="initShaders.js"></script>
    <script type="text/javascript" src="common.js"></script>
    <script type="text/javascript" src="forest.js"></script>
    <script type="text/javascript" src="lighting.js"></script>
</head>
<body style="background-color: #1a2a2a; margin: 0; display: flex; flex-direction: column; align-items: center;">
    <canvas id="gl-canvas" width="800" height="600" style="border: 1px solid #334444; margin-top: 20px;">
        WebGL Error
    </canvas>
    
    <div style="color: white; font-family: sans-serif; text-align: center; margin-top: 10px;">
        <h3>Hidden Forest - Project 1</h3>
        <p><b>WASD:</b> Move around the terrain [cite: 31]</p>
        <p><b>Arrow Keys:</b> Look around (Pitch & Yaw) [cite: 17, 18]</p>
        <p><i>Mode: Smooth Shading [cite: 23, 24]</i></p>
    </div>
</body>
</html>
