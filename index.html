<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hidden Forest - Project 1</title>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;
        attribute vec3 vColor;
        attribute vec3 vNormal;
        attribute float vEmissive;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        varying vec3 fColor;
        varying vec3 fViewNormal;
        varying vec3 fWorldNormal;
        varying vec3 fPosition;
        varying vec3 fWorldPos; // Pass world position for noise
        varying float fEmissive;
        varying float fHeight;

        void main() {
            vec4 pos = modelViewMatrix * vPosition;
            fPosition = pos.xyz;
            fWorldPos = vPosition.xyz; 
            fHeight = vPosition.y; 
            fViewNormal = normalize(mat3(modelViewMatrix) * vNormal);
            fWorldNormal = normalize(vNormal);
            fColor = vColor;
            fEmissive = vEmissive;
            gl_Position = projectionMatrix * pos;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 fColor;
        varying vec3 fViewNormal;
        varying vec3 fWorldNormal;
        varying vec3 fPosition;
        varying vec3 fWorldPos;
        varying float fEmissive;
        varying float fHeight;

        uniform float fogDensity;

        // Lighting uniforms — set by JS presets
        uniform vec3  uLightDir;
        uniform vec3  uSunTintHigh;   // full-lit band tint
        uniform vec3  uSunTintMid;    // mid band tint
        uniform vec3  uSunTintShadow; // shadow band tint
        uniform vec3  uAmbientColor;
        uniform vec3  uFogColor;
        uniform float uFogA;          // fog exponent coefficients
        uniform float uFogB;
        uniform float uDarkness;      // overall scene brightness multiplier
        uniform float uShadowDepth;   // how dark the shadow band gets

        float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
        }
        float smoothNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        void main() {
            vec3 L       = normalize(uLightDir);
            vec3 Nworld  = normalize(fWorldNormal);
            float NdL    = dot(Nworld, L);

            float dapple = smoothNoise(fWorldPos.xz * 0.8) * 0.6
                         + smoothNoise(fWorldPos.xz * 2.1) * 0.4;
            dapple = smoothstep(0.38, 0.72, dapple);
            float litNdL = NdL + dapple * 0.35 * step(0.0, NdL);

            float diffuse;
            vec3  sunTint;
            if (litNdL > 0.6) {
                diffuse = 1.0;
                sunTint = uSunTintHigh;
            } else if (litNdL > 0.05) {
                diffuse = 0.62;
                sunTint = uSunTintMid;
            } else {
                diffuse = uShadowDepth;
                sunTint = uSunTintShadow;
            }

            vec3 ambient = fColor * uAmbientColor * 0.4;
            vec3 color   = fColor * sunTint * diffuse;

            float shadowMask = 1.0 - smoothstep(-0.05, 0.25, NdL);
            color = mix(color, color + ambient, shadowMask * 0.5);
            color *= uDarkness;

            if (fEmissive > 0.01) {
                color = fColor * 2.2 * uDarkness;
            }

            float dist      = length(fPosition);
            float fogFactor = exp(-uFogA * dist * dist - uFogB * dist);
            fogFactor       = clamp(fogFactor, 0.0, 1.0);
            color = mix(uFogColor, color, fogFactor);

            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script type="text/javascript" src="webgl-utils.js"></script>
    <script type="text/javascript" src="initShaders.js"></script>
    <script type="text/javascript" src="common.js"></script>
    <script type="text/javascript" src="forest.js"></script>
</head>
<body style="background-color: #1a2a2a; margin: 0; display: flex; flex-direction: column; align-items: center;">
    <canvas id="gl-canvas" width="800" height="600" style="border: 1px solid #334444; margin-top: 20px;">
        WebGL Error
    </canvas>

    <div style="color: white; font-family: sans-serif; text-align: center; margin-top: 10px;">
        <h3>Hidden Forest - Project 1</h3>
        <p><b>WASD:</b> Move around the terrain &nbsp;|&nbsp; <b>Arrow Keys:</b> Look around</p>
    </div>

    <style>
        .preset-btn {
            padding: 8px 18px;
            margin: 4px;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            color: #ddd;
            font-family: sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.5);
            color: #fff;
        }
        .preset-btn.active {
            background: rgba(255,255,255,0.28);
            border-color: #fff;
            color: #fff;
            font-weight: bold;
        }
    </style>

    <div style="margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; max-width: 600px;">
        <button class="preset-btn active" id="btn-daytime"    onclick="setPreset('daytime')">☀️ Daytime</button>
        <button class="preset-btn"        id="btn-goldenHour" onclick="setPreset('goldenHour')">🌇 Golden Hour</button>
        <button class="preset-btn"        id="btn-sunrise"    onclick="setPreset('sunrise')">🌅 Sunrise</button>
        <button class="preset-btn"        id="btn-sunset"     onclick="setPreset('sunset')">🌆 Sunset</button>
        <button class="preset-btn"        id="btn-blueHour"   onclick="setPreset('blueHour')">🌃 Blue Hour</button>
        <button class="preset-btn"        id="btn-nighttime"  onclick="setPreset('nighttime')">🌙 Nighttime</button>
    </div>
</body>
</html>
